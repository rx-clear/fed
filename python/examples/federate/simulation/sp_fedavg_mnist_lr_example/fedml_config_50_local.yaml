common_args:
  training_type: "simulation"
  random_seed: 0
  config_version: "release"
  mlops_api_key: ""
  mlops_project_name: sp_fedrep_dmcfe_local
  mlops_run_name: fedrep_mnist_dmcfe_50_rounds_local
  backend: "sp"

data_args:
  dataset: "mnist"
  data_cache_dir: ~/.cache/fedml_data
  partition_method: "hetero"
  partition_alpha: 0.5

model_args:
  model: "cnn"

train_args:
  federated_optimizer: "FedRep"
  fedrep_personalized_layers:
    - "linear_2"
  fedrep_head_epochs: 1
  fedrep_representation_epochs: 1
  enable_dmcfe: true
  dmcfe_aggregation_mode: "optimized"
  dmcfe_backend: "chunked_reference"
  dmcfe_modulus_bits: 256
  dmcfe_scale: 16384
  dmcfe_clip_bound: 8.0
  dmcfe_chunk_size: 65536
  dmcfe_enable_weight_signatures: true
  dmcfe_dropout_before_encryption_ids: []
  dmcfe_dropout_before_recovery_ids: []
  dmcfe_recovery_threshold: 2
  dmcfe_validation_dim: 7850
  experiment_result_file: results/dmcfe_fedrep_50_local.csv
  run_dmcfe_smoke_tests: false
  client_id_list: "[]"
  client_num_in_total: 1000
  client_num_per_round: 3
  comm_round: 50
  epochs: 1
  batch_size: 10
  client_optimizer: sgd
  learning_rate: 0.03
  weight_decay: 0.001

validation_args:
  frequency_of_the_test: 50

device_args:
  using_gpu: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_tracking: false
  enable_wandb: false
  wandb_key: ""
  wandb_entity: ""
  wandb_project: ""
  run_name: fedrep_mnist_dmcfe_50_rounds_local
  using_mlops: false
